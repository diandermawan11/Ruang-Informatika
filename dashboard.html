
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - Ruang Informatika</title>

<style>
:root {
  --bg:#071329;
  --panel:#102443;
  --panel2:#0b1d37;
  --line:#29466d;
  --text:#f4f8ff;
  --muted:#a8bbd7;
  --blue:#258bff;
  --green:#30c99a;
  --red:#f16b76;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:14px/1.6 system-ui,sans-serif;
}
button,input,select,textarea {font:inherit}
button {cursor:pointer}
.hidden {display:none!important}
.app {min-height:100vh;display:grid;grid-template-columns:245px 1fr}
.sidebar {
  background:#051125;
  border-right:1px solid var(--line);
  padding:22px 15px;
  position:sticky;top:0;height:100vh;
  overflow:auto;
}
.brand {font-size:18px;font-weight:850;margin-bottom:28px}
.profile {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:13px;padding:14px;margin-bottom:22px;
}
.profile small {color:var(--muted)}
.nav-title {
  color:#7795bb;font-size:10px;
  font-weight:800;letter-spacing:1px;
  margin:20px 10px 8px;
}
.nav-button {
  width:100%;display:flex;gap:10px;
  align-items:center;text-align:left;
  border:0;border-radius:9px;
  background:transparent;color:#b7c9e3;
  padding:11px 12px;margin:3px 0;
}
.nav-button:hover,.nav-button.active {
  background:#173a67;color:white;
}
.main {min-width:0}
.topbar {
  height:72px;border-bottom:1px solid var(--line);
  background:#091a32;
  display:flex;align-items:center;
  justify-content:space-between;
  padding:0 28px;
  position:sticky;top:0;z-index:5;
}
.topbar h1 {font-size:19px;margin:0}
.content {padding:28px;max-width:1500px;margin:auto}
.grid {display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.panel {
  background:linear-gradient(145deg,#102747,#0a1b34);
  border:1px solid var(--line);
  border-radius:15px;padding:20px;
  margin-bottom:17px;min-width:0;
}
.panel h2,.panel h3 {margin-top:0}
.stat {font-size:29px;font-weight:850}
.muted {color:var(--muted)}
.small {font-size:12px}
.btn {
  border:1px solid var(--line);
  background:#102a4c;color:white;
  border-radius:9px;padding:9px 13px;
  font-weight:700;display:inline-flex;
  align-items:center;justify-content:center;
}
.btn.primary {background:#187eea;border-color:#187eea}
.btn.danger {background:#542332;border-color:#a74a5d}
.btn.success {background:#124a43;border-color:#278c78}
.btn:disabled {opacity:.5;cursor:not-allowed}
input,select,textarea {
  width:100%;padding:11px;
  color:white;background:#07182f;
  border:1px solid #365577;
  border-radius:8px;outline:none;
}
textarea {min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus {
  border-color:#3196ff;
}
label {display:block;font-size:12px;margin:12px 0 6px}
.form-grid {display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions {display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.item {
  padding:15px 0;border-bottom:1px solid var(--line);
}
.item:last-child {border-bottom:0}
.item-title {font-weight:800;font-size:15px}
.tag {
  display:inline-block;background:#183e68;
  border-radius:20px;padding:3px 9px;
  font-size:10px;margin:3px 3px 3px 0;
}
.status {color:#72e3bd}
.question-card {
  background:#081a32;
  border:1px solid var(--line);
  border-radius:11px;padding:14px;margin:12px 0;
}
.question-card .options {
  display:grid;grid-template-columns:1fr 1fr;gap:9px;
}
.question-card input {margin-top:5px}
table {width:100%;border-collapse:collapse;min-width:600px}
th,td {
  border-bottom:1px solid var(--line);
  padding:11px;text-align:left;
  vertical-align:top;
}
th {color:#8eb9e9;font-size:11px}
.table-wrap {overflow:auto}
.toast {
  position:fixed;bottom:20px;right:20px;
  max-width:360px;background:#15385c;
  border:1px solid #4d84bc;
  border-radius:10px;padding:13px 17px;
  z-index:30;display:none;
}
.quiz-option {
  display:block;padding:12px;margin:8px 0;
  border:1px solid var(--line);
  border-radius:9px;background:#0b1e38;
}
.quiz-option input {width:auto;margin-right:9px}
.empty {
  padding:24px;text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:12px;
}
@media(max-width:850px) {
  .app {grid-template-columns:1fr}
  .sidebar {
    height:auto;position:relative;
    border-right:0;border-bottom:1px solid var(--line);
  }
  .nav-list {display:flex;flex-wrap:wrap;gap:4px}
  .nav-button {width:auto}
  .nav-title {display:none}
  .grid {grid-template-columns:1fr 1fr}
}
@media(max-width:550px) {
  .content {padding:15px}
  .topbar {padding:0 15px}
  .grid,.form-grid {grid-template-columns:1fr}
  .sidebar {padding:15px}
  .brand {margin-bottom:12px}
}
</style>
</head>

<body>

<div class="app">
<aside class="sidebar">
  <div class="brand">◈ Ruang Informatika</div>

  <div class="profile">
    <div id="profileName">Pengguna</div>
    <small id="profileRole">Memuat sesi...</small>
    <div class="small muted" id="profileClass"></div>
  </div>

  <div class="nav-title">MENU UTAMA</div>
  <nav class="nav-list" id="navigation"></nav>

  <div style="margin-top:25px">
    <button class="btn danger" id="logoutButton" style="width:100%">
      Keluar
    </button>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <h1 id="pageTitle">Dashboard</h1>
    <span class="small muted" id="currentDate"></span>
  </header>

  <div class="content" id="pageContent">
    <div class="empty">Memuat dashboard...</div>
  </div>
</main>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
"use strict";

// ========================================
// AUTENTIKASI DAN KONFIGURASI API
// ========================================

const API_URL = "/.netlify/functions/content-api";

const token = sessionStorage.getItem("ri_session_token");
let session = null;

try {
  session = JSON.parse(sessionStorage.getItem("ri_session") || "null");
} catch {
  session = null;
}

if (
  !token ||
  !session ||
  !["guru", "siswa"].includes(session.role)
) {
  window.location.replace("./index.html?role=siswa");
}

const role = session ? session.role : "siswa";

const CLASS_OPTIONS = {
  SD: [
    ["Responsible","Kelas 6 - Responsible"],
    ["Reliable","Kelas 6 - Reliable"]
  ],
  SMP: [
    ["Obedient","Kelas 7 - Obedient"],
    ["Persistent","Kelas 7 - Persistent"],
    ["Supportive","Kelas 7 - Supportive"],
    ["Confident","Kelas 7 - Confident"],
    ["Respectful","Kelas 8 - Respectful"],
    ["Reflective","Kelas 8 - Reflective"],
    ["Inspiring","Kelas 8 - Inspiring"]
  ],
  SMA: [
    ["Motivated","Kelas 10 - Motivated"],
    ["Courteous","Kelas 11 - Courteous"],
    ["Leader","Kelas 12 - Leader"]
  ],
  SMK: [
    ["Innovative","Kelas 10 - Innovative"],
    ["Industrious","Kelas 11 - Industrious"]
  ]
};

const state = {
  view:"overview",
  materials:[],
  quizzes:[],
  assignments:[],
  submissions:[],
  results:[],
  editMaterial:null,
  editQuiz:null,
  editAssignment:null,
  activeQuiz:null
};

const $ = selector => document.querySelector(selector);

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function toast(message) {
  const box = $("#toast");
  box.textContent = message;
  box.style.display = "block";
  clearTimeout(window.riToastTimer);
  window.riToastTimer = setTimeout(() => {
    box.style.display = "none";
  }, 3500);
}

function formatDate(value) {
  if (!value) return "-";
  const date = new Date(value);
  if (isNaN(date.getTime())) return String(value);
  return date.toLocaleString("id-ID");
}

async function api(action, payload = {}) {
  const response = await fetch(API_URL, {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer " + token
    },
    body:JSON.stringify({
      action,
      ...payload
    })
  });

  let result;
  try {
    result = await response.json();
  } catch {
    throw new Error("Respons server tidak dapat dibaca.");
  }

  if (response.status === 401) {
    sessionStorage.removeItem("ri_session_token");
    sessionStorage.removeItem("ri_session");
    window.location.replace("./index.html?role=siswa");
    throw new Error("Sesi berakhir. Silakan login kembali.");
  }

  if (!response.ok || !result.ok) {
    throw new Error(result.message || "Permintaan gagal.");
  }

  return result;
}

// ========================================
// IDENTITAS DAN NAVIGASI
// ========================================

$("#profileName").textContent = session?.name || "Pengguna";
$("#profileRole").textContent =
  role === "guru" ? "AKUN GURU" : "AKUN SISWA";

$("#profileClass").textContent =
  role === "siswa"
    ? session.jenjang + " - " + session.kelas
    : "Pengelola pembelajaran";

$("#currentDate").textContent =
  new Date().toLocaleDateString("id-ID", {
    weekday:"long",day:"numeric",month:"long",year:"numeric"
  });

const NAV_ITEMS = role === "guru"
  ? [
      ["overview","Dashboard","⌂"],
      ["materials","Materi Pembelajaran","▤"],
      ["quizzes","Ulangan Harian","✎"],
      ["assignments","Tugas dan Proyek","▣"],
      ["submissions","Pengumpulan Siswa","⇧"],
      ["results","Rekap Nilai","▥"]
    ]
  : [
      ["overview","Dashboard","⌂"],
      ["materials","Materi Pembelajaran","▤"],
      ["quizzes","Ulangan Harian","✎"],
      ["assignments","Tugas dan Proyek","▣"],
      ["results","Hasil Belajar","▥"]
    ];

function renderNavigation() {
  $("#navigation").innerHTML = NAV_ITEMS.map(([id,label,icon]) => `
    <button class="nav-button ${state.view === id ? "active" : ""}"
      data-view="${id}">
      <span>${icon}</span>${label}
    </button>
  `).join("");
}

function setView(view) {
  if (!NAV_ITEMS.some(item => item[0] === view)) return;
  state.view = view;
  state.activeQuiz = null;
  renderApp();
}

$("#navigation").addEventListener("click", event => {
  const button = event.target.closest("[data-view]");
  if (button) setView(button.dataset.view);
});

$("#logoutButton").addEventListener("click", () => {
  sessionStorage.removeItem("ri_session_token");
  sessionStorage.removeItem("ri_session");
  window.location.replace("./index.html");
});

// ========================================
// TARGET JENJANG DAN KELAS UNTUK GURU
// ========================================

function targetFields(prefix, level = "SD", selectedClass = "ALL") {
  const levels = ["SD","SMP","SMA","SMK"];

  if (!["SD","SMP","SMA","SMK","ALL"].includes(level)) {
    level = "SD";
  }

  const classes = level === "ALL" ? [] : (CLASS_OPTIONS[level] || []);

  const classHTML = [
    `<option value="ALL">Semua kelas pada jenjang</option>`,
    ...classes.map(([value,label]) =>
      `<option value="${value}" ${selectedClass === value ? "selected" : ""}>${escapeHTML(label)}</option>`
    )
  ].join("");

  return `
    <div class="form-grid">
      <div>
        <label>Jenjang</label>
        <select name="${prefix}Jenjang" data-target-level="${prefix}">
          <option value="ALL" ${level === "ALL" ? "selected" : ""}>Semua Jenjang</option>
          ${levels.map(value =>
            `<option value="${value}" ${level === value ? "selected" : ""}>${value}</option>`
          ).join("")}
        </select>
      </div>
      <div>
        <label>Kelas</label>
        <select name="${prefix}Kelas" data-target-class="${prefix}">
          ${classHTML}
        </select>
      </div>
    </div>
  `;
}

document.addEventListener("change", event => {
  const select = event.target.closest("[data-target-level]");
  if (!select) return;

  const prefix = select.dataset.targetLevel;
  const classSelect = document.querySelector(
    `[data-target-class="${prefix}"]`
  );

  const level = select.value;
  const classes = level === "ALL" ? [] : (CLASS_OPTIONS[level] || []);

  classSelect.innerHTML = [
    `<option value="ALL">Semua kelas pada jenjang</option>`,
    ...classes.map(([value,label]) =>
      `<option value="${value}">${escapeHTML(label)}</option>`
    )
  ].join("");
});

// ========================================
// UPLOAD FILE
// ========================================

function fileToPayload(file) {
  return new Promise((resolve, reject) => {
    if (!file) {
      resolve(null);
      return;
    }

    if (file.size > 3.8 * 1024 * 1024) {
      reject(new Error("Ukuran file maksimal 3,8 MB."));
      return;
    }

    const reader = new FileReader();

    reader.onload = () => {
      const result = String(reader.result);
      resolve({
        name:file.name,
        mimeType:file.type,
        base64:result.split(",")[1]
      });
    };

    reader.onerror = () => {
      reject(new Error("File gagal dibaca."));
    };

    reader.readAsDataURL(file);
  });
}

// ========================================
// DASHBOARD UTAMA
// ========================================

async function refreshAll() {
  const content = await api("listContent");

  state.materials = content.materials || [];
  state.quizzes = content.quizzes || [];
  state.assignments = content.assignments || [];

  if (role === "guru") {
    const [submissions, results] = await Promise.all([
      api("listSubmissions"),
      api("listResults")
    ]);

    state.submissions = submissions.items || [];
    state.results = results.items || [];
  } else {
    const results = await api("listResults");
    state.results = results.items || [];
  }

  renderApp();
}

function renderApp() {
  renderNavigation();

  const labels = {
    overview:"Dashboard",
    materials:"Materi Pembelajaran",
    quizzes:"Ulangan Harian",
    assignments:"Tugas dan Proyek",
    submissions:"Pengumpulan Siswa",
    results:role === "guru" ? "Rekap Nilai Siswa" : "Hasil Belajar"
  };

  $("#pageTitle").textContent = labels[state.view] || "Dashboard";

  const renderers = {
    overview:renderOverview,
    materials:renderMaterials,
    quizzes:renderQuizzes,
    assignments:renderAssignments,
    submissions:renderSubmissions,
    results:renderResults
  };

  $("#pageContent").innerHTML = renderers[state.view]();
}

// ========================================
// DASHBOARD RINGKASAN
// ========================================

function renderOverview() {
  if (role === "guru") {
    const pending = state.submissions.filter(
      item => item.Status !== "Sudah dinilai"
    ).length;

    return `
      <h2>Selamat datang, ${escapeHTML(session.name)}.</h2>
      <p class="muted">Kelola pembelajaran seluruh jenjang melalui satu dashboard.</p>

      <div class="grid">
        <div class="panel">
          <div class="muted">Total Materi</div>
          <div class="stat">${state.materials.length}</div>
        </div>
        <div class="panel">
          <div class="muted">Total Ulangan</div>
          <div class="stat">${state.quizzes.length}</div>
        </div>
        <div class="panel">
          <div class="muted">Tugas dan Proyek</div>
          <div class="stat">${state.assignments.length}</div>
        </div>
        <div class="panel">
          <div class="muted">Menunggu Penilaian</div>
          <div class="stat">${pending}</div>
        </div>
        <div class="panel">
          <div class="muted">Total Pengumpulan</div>
          <div class="stat">${state.submissions.length}</div>
        </div>
        <div class="panel">
          <div class="muted">Catatan Nilai</div>
          <div class="stat">${state.results.length}</div>
        </div>
      </div>

      <div class="panel">
        <h3>Pengelolaan semua jenjang</h3>
        <p class="muted">SD, SMP, SMA, dan SMK dapat dikelola melalui menu materi, ulangan, tugas, pengumpulan, dan rekap nilai.</p>
        <button class="btn primary" data-view="materials">Kelola Materi</button>
        <button class="btn" data-view="quizzes">Kelola Ulangan</button>
      </div>
    `;
  }

  return `
    <h2>Halo, ${escapeHTML(session.name)}.</h2>
    <p class="muted">
      Selamat datang di ruang belajar ${escapeHTML(session.jenjang)}
      kelas ${escapeHTML(session.kelas)}.
    </p>

    <div class="grid">
      <div class="panel">
        <div class="muted">Materi Tersedia</div>
        <div class="stat">${state.materials.length}</div>
      </div>
      <div class="panel">
        <div class="muted">Ulangan Tersedia</div>
        <div class="stat">${state.quizzes.length}</div>
      </div>
      <div class="panel">
        <div class="muted">Tugas dan Proyek</div>
        <div class="stat">${state.assignments.length}</div>
      </div>
      <div class="panel">
        <div class="muted">Catatan Nilai</div>
        <div class="stat">${state.results.length}</div>
      </div>
    </div>

    <div class="panel">
      <h3>Mulai belajar</h3>
      <p class="muted">Buka materi, kerjakan ulangan, dan kumpulkan tugas dari menu dashboard.</p>
      <button class="btn primary" data-view="materials">Buka Materi</button>
      <button class="btn" data-view="quizzes">Lihat Ulangan</button>
    </div>
  `;
}

// ========================================
// MATERI PEMBELAJARAN
// ========================================

function renderMaterials() {
  let editor = "";

  if (role === "guru") {
    const item = state.editMaterial || {};

    editor = `
      <div class="panel">
        <h3>${item.ID ? "Perbarui Materi" : "Tambah Materi Baru"}</h3>

        <form id="materialForm" data-id="${escapeHTML(item.ID || "")}">
          ${targetFields("material", item.Jenjang || "SD", item.Kelas || "ALL")}

          <label>Judul Materi</label>
          <input name="title" required maxlength="180"
            value="${escapeHTML(item.Judul || "")}">

          <label>Deskripsi</label>
          <textarea name="description">${escapeHTML(item.Deskripsi || "")}</textarea>

          <label>Isi Materi</label>
          <textarea name="content">${escapeHTML(item.Konten || "")}</textarea>

          <label>File Materi (maksimal 3,8 MB)</label>
          <input name="file" type="file"
            accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.jpg,.jpeg,.png,.zip">

          ${item["Nama File"] ? `<p class="small muted">File saat ini: ${escapeHTML(item["Nama File"])}</p>` : ""}

          <label>
            <input type="checkbox" name="published"
              ${item.ID ? (item.Dipublikasikan ? "checked" : "") : "checked"}
              style="width:auto">
            Publikasikan materi
          </label>

          <div class="form-actions">
            <button class="btn primary" type="submit">Simpan Materi</button>
            <button class="btn" type="reset">Reset</button>
          </div>
        </form>
      </div>
    `;
  }

  const list = state.materials.length
    ? state.materials.map(item => `
      <div class="item">
        <div class="item-title">${escapeHTML(item.Judul)}</div>
        <span class="tag">${escapeHTML(item.Jenjang)}</span>
        <span class="tag">${escapeHTML(item.Kelas)}</span>
        <p class="muted">${escapeHTML(item.Deskripsi || "")}</p>
        ${item.Konten ? `<p>${escapeHTML(item.Konten)}</p>` : ""}
        ${item["File URL"] ? `<a class="btn" href="${escapeHTML(item["File URL"])}" target="_blank" rel="noopener">Buka File ${escapeHTML(item["Nama File"] || "")}</a>` : ""}
        ${role === "guru" ? `
          <div class="form-actions">
            <button class="btn" data-action="edit-material" data-id="${escapeHTML(item.ID)}">Edit</button>
            <button class="btn danger" data-action="delete-material" data-id="${escapeHTML(item.ID)}">Hapus</button>
          </div>
        ` : ""}
      </div>
    `).join("")
    : `<div class="empty">Belum ada materi yang tersedia.</div>`;

  return `${editor}<div class="panel"><h3>Daftar Materi</h3>${list}</div>`;
}

// ========================================
// BANK SOAL
// ========================================

function questionCard(question = {}, index = 0) {
  const options = question.options || ["","","",""];
  const correct = Number(question.correctIndex || 0);

  return `
    <div class="question-card">
      <div class="form-actions" style="justify-content:space-between">
        <b>Soal ${index + 1}</b>
        <button type="button" class="btn danger" data-action="remove-question">Hapus Soal</button>
      </div>

      <label>Pertanyaan</label>
      <textarea class="q-text" required>${escapeHTML(question.text || "")}</textarea>

      <div class="options">
        ${[0,1,2,3].map(i => `
          <div>
            <label>Pilihan ${String.fromCharCode(65+i)}</label>
            <input class="q-option" data-index="${i}" required
              value="${escapeHTML(options[i] || "")}">
          </div>
        `).join("")}
      </div>

      <label>Kunci Jawaban</label>
      <select class="q-correct">
        ${[0,1,2,3].map(i =>
          `<option value="${i}" ${correct === i ? "selected" : ""}>
            ${String.fromCharCode(65+i)}
          </option>`
        ).join("")}
      </select>
    </div>
  `;
}

function collectQuestions() {
  const cards = [...document.querySelectorAll(".question-card")];

  if (!cards.length) {
    throw new Error("Tambahkan minimal satu soal.");
  }

  return cards.map((card, index) => {
    const text = card.querySelector(".q-text").value.trim();
    const options = [...card.querySelectorAll(".q-option")]
      .map(input => input.value.trim());

    if (!text || options.some(value => !value)) {
      throw new Error("Lengkapi pertanyaan dan semua pilihan pada soal " + (index+1) + ".");
    }

    return {
      text,
      options,
      correctIndex:Number(card.querySelector(".q-correct").value)
    };
  });
}

function renderQuizzes() {
  if (role === "siswa" && state.activeQuiz) {
    return renderTakeQuiz(state.activeQuiz);
  }

  let editor = "";

  if (role === "guru") {
    const item = state.editQuiz || {};
    let questions = [];

    try {
      questions = state.editQuiz
        ? JSON.parse(item["Soal JSON"] || "[]")
        : [];
    } catch {
      questions = [];
    }

    editor = `
      <div class="panel">
        <h3>${item.ID ? "Perbarui Ulangan" : "Buat Ulangan Baru"}</h3>

        <form id="quizForm" data-id="${escapeHTML(item.ID || "")}">
          ${targetFields("quiz", item.Jenjang || "SD", item.Kelas || "ALL")}

          <label>Nama Ulangan</label>
          <input name="title" required maxlength="180"
            value="${escapeHTML(item.Judul || "")}">

          <label>Deskripsi</label>
          <textarea name="description">${escapeHTML(item.Deskripsi || "")}</textarea>

          <div class="form-grid">
            <div>
              <label>Durasi (menit)</label>
              <input name="duration" type="number" min="1" max="300"
                value="${escapeHTML(item.Durasi || 60)}" required>
            </div>
            <div>
              <label>Waktu Mulai</label>
              <input name="startAt" type="datetime-local"
                value="${escapeHTML(item.Mulai || "")}">
            </div>
          </div>

          <label>Tenggat Ulangan</label>
          <input name="deadline" type="datetime-local"
            value="${escapeHTML(item.Tenggat || "")}">

          <h3 style="margin-top:22px">Bank Soal</h3>
          <div id="questionContainer">
            ${(questions.length ? questions : [{}]).map(questionCard).join("")}
          </div>

          <button class="btn" type="button" id="addQuestion">+ Tambah Soal</button>

          <label>
            <input type="checkbox" name="published"
              ${item.ID ? (item.Dipublikasikan ? "checked" : "") : "checked"}
              style="width:auto">
            Publikasikan ulangan
          </label>

          <div class="form-actions">
            <button class="btn primary" type="submit">Simpan Ulangan</button>
            <button class="btn" type="reset">Reset</button>
          </div>
        </form>
      </div>
    `;
  }

  const list = state.quizzes.length
    ? state.quizzes.map(item => {
      let total = item.questions?.length || 0;
      if (item["Soal JSON"]) {
        try { total = JSON.parse(item["Soal JSON"]).length; } catch {}
      }

      return `
        <div class="item">
          <div class="item-title">${escapeHTML(item.Judul || item.title)}</div>
          <span class="tag">${escapeHTML(item.Jenjang || item.jenjang)}</span>
          <span class="tag">${escapeHTML(item.Kelas || item.kelas)}</span>
          <p class="muted">${escapeHTML(item.Deskripsi || item.description || "")}</p>
          <p class="small muted">${total} soal · ${escapeHTML(item.Durasi || item.duration)} menit</p>

          ${role === "guru" ? `
            <div class="form-actions">
              <button class="btn" data-action="edit-quiz" data-id="${escapeHTML(item.ID)}">Edit</button>
              <button class="btn danger" data-action="delete-quiz" data-id="${escapeHTML(item.ID)}">Hapus</button>
            </div>
          ` : `
            <button class="btn primary" data-action="take-quiz" data-id="${escapeHTML(item.id)}">
              Kerjakan Ulangan
            </button>
          `}
        </div>
      `;
    }).join("")
    : `<div class="empty">Belum ada ulangan yang tersedia.</div>`;

  return `${editor}<div class="panel"><h3>Daftar Ulangan</h3>${list}</div>`;
}

function renderTakeQuiz(quiz) {
  return `
    <div class="panel">
      <button class="btn" data-action="back-quizzes">← Kembali</button>
      <h2>${escapeHTML(quiz.title)}</h2>
      <p class="muted">${escapeHTML(quiz.description || "")}</p>
      <span class="tag">Durasi: ${escapeHTML(quiz.duration)} menit</span>

      <form id="takeQuizForm" data-id="${escapeHTML(quiz.id)}">
        ${quiz.questions.map((question,index) => `
          <div class="question-card">
            <b>${index+1}. ${escapeHTML(question.text)}</b>
            ${question.options.map((option,i) => `
              <label class="quiz-option">
                <input type="radio" name="q${index}" value="${i}">
                ${String.fromCharCode(65+i)}. ${escapeHTML(option)}
              </label>
            `).join("")}
          </div>
        `).join("")}

        <button class="btn primary" type="submit">Kirim Jawaban</button>
      </form>
    </div>
  `;
}

// TUGAS DAN PROYEK

// ========================================
// PENGUMPULAN DAN PENILAIAN GURU
// ========================================

      <div class="item">

        <span class="tag">${escapeHTML(item.Jenjang)}</span>
        <span class="tag">${escapeHTML(item.Kelas)}</span>

          <div class="form-grid">

// REKAP NILAI

// ========================================
// AKSI EDIT DAN HAPUS
// ========================================

async function deleteItem(action, id) {
  if (!confirm("Apakah Anda yakin ingin menghapus data ini?")) return;

  await api(action, {id});
  toast("Data berhasil dihapus.");
  await refreshAll();
}

document.addEventListener("click", async event => {
  const viewButton = event.target.closest("[data-view]");
  if (viewButton) {
    setView(viewButton.dataset.view);
    return;
  }

  const button = event.target.closest("[data-action]");
  if (!button) return;

  const id = button.dataset.id;
  const action = button.dataset.action;

  try {
    if (action === "edit-material") {
      state.editMaterial = state.materials.find(x => x.ID === id);
      setView("materials");
    }

    if (action === "edit-quiz") {
      state.editQuiz = state.quizzes.find(x => x.ID === id);
      setView("quizzes");
    }

    if (action === "edit-assignment") {
      state.editAssignment = state.assignments.find(x => x.ID === id);
      setView("assignments");
    }

    if (action === "delete-material") {
      await deleteItem("deleteMaterial", id);
    }

    if (action === "delete-quiz") {
      await deleteItem("deleteQuiz", id);
    }

    if (action === "delete-assignment") {
      await deleteItem("deleteAssignment", id);
    }

    if (action === "take-quiz") {
      state.activeQuiz = state.quizzes.find(x => x.id === id);
      renderApp();
    }

    if (action === "back-quizzes") {
      state.activeQuiz = null;
      renderApp();
    }

    if (action === "remove-question") {
      button.closest(".question-card").remove();
    }

  } catch (error) {
    toast(error.message);
  }
});

// ========================================
// FORM MATERI
// ========================================

document.addEventListener("submit", async event => {
  const form = event.target;

  if (form.id !== "materialForm") return;

  event.preventDefault();

  try {
    const data = new FormData(form);
    const file = await fileToPayload(form.querySelector('[name="file"]').files[0]);

    const id = form.dataset.id;

    const item = {
      jenjang:data.get("materialJenjang"),
      kelas:data.get("materialKelas"),
      title:data.get("title"),
      description:data.get("description"),
      content:data.get("content"),
      published:data.get("published") === "on"
    };

    await api(id ? "updateMaterial" : "createMaterial", {
      ...(id ? {id} : {}),
      item,
      ...(file ? {file} : {})
    });

    state.editMaterial = null;
    toast("Materi berhasil disimpan.");
    await refreshAll();

  } catch (error) {
    toast(error.message);
  }
});

// ========================================
// TAMBAH SOAL
// ========================================

document.addEventListener("click", event => {
  if (event.target.id !== "addQuestion") return;

  const container = $("#questionContainer");
  const index = container.children.length;

  container.insertAdjacentHTML("beforeend", questionCard({}, index));
});

// ========================================
// FORM ULANGAN
// ========================================

document.addEventListener("submit", async event => {
  const form = event.target;
  if (form.id !== "quizForm") return;

  event.preventDefault();

  try {
    const data = new FormData(form);
    const id = form.dataset.id;

    const item = {
      jenjang:data.get("quizJenjang"),
      kelas:data.get("quizKelas"),
      title:data.get("title"),
      description:data.get("description"),
      duration:Number(data.get("duration")),
      startAt:data.get("startAt"),
      deadline:data.get("deadline"),
      published:data.get("published") === "on",
      questions:collectQuestions()
    };

    await api(id ? "updateQuiz" : "createQuiz", {
      ...(id ? {id} : {}),
      item
    });

    state.editQuiz = null;
    toast("Ulangan berhasil disimpan.");
    await refreshAll();

  } catch (error) {
    toast(error.message);
  }
});

// ========================================
// SISWA MENGERJAKAN ULANGAN
// ========================================

document.addEventListener("submit", async event => {
  const form = event.target;
  if (form.id !== "takeQuizForm") return;

  event.preventDefault();

  try {
    const quizId = form.dataset.id;
    const quiz = state.quizzes.find(x => x.id === quizId);

    if (!quiz) throw new Error("Ulangan tidak ditemukan.");

    const answers = {};

    quiz.questions.forEach((question,index) => {
      const selected = form.querySelector(
        `input[name="q${index}"]:checked`
      );

      answers[index] = selected ? Number(selected.value) : null;
    });

    const result = await api("submitQuiz", {
      quizId,
      answers
    });

    state.activeQuiz = null;

    toast(
      "Ulangan terkirim. Nilai: " + result.score +
      ". Benar: " + result.correct +
      ", salah: " + result.wrong +
      ", kosong: " + result.empty
    );

    await refreshAll();
    setView("results");

  } catch (error) {
    toast(error.message);
  }
});

// ========================================
// FORM TUGAS GURU
// ========================================

document.addEventListener("submit", async event => {
  const form = event.target;
  if (form.id !== "assignmentForm") return;

  event.preventDefault();

  try {
    const data = new FormData(form);
    const id = form.dataset.id;

    const item = {
      jenjang:data.get("assignmentJenjang"),
      kelas:data.get("assignmentKelas"),
      type:data.get("type"),
      title:data.get("title"),
      description:data.get("description"),
      instructions:data.get("instructions"),
      deadline:data.get("deadline"),
      published:data.get("published") === "on"
    };

    await api(id ? "updateAssignment" : "createAssignment", {
      ...(id ? {id} : {}),
      item
    });

    state.editAssignment = null;
    toast("Tugas berhasil disimpan.");
    await refreshAll();

  } catch (error) {
    toast(error.message);
  }
});

// ========================================
// SISWA MENGUMPULKAN TUGAS
// ========================================

document.addEventListener("submit", async event => {
  const form = event.target.closest(".studentSubmissionForm");
  if (!form) return;

  event.preventDefault();

  try {
    const data = new FormData(form);
    const type = data.get("type");

    const payload = {
      assignmentId:form.dataset.id,
      submissionType:type
    };

    if (type === "text") {
      payload.text = data.get("text");
    }

    if (type === "link") {
      payload.url = data.get("url");
    }

    if (type === "file") {
      payload.file = await fileToPayload(
        form.querySelector('[name="file"]').files[0]
      );
    }

    await api("submitAssignment", payload);

    toast("Tugas berhasil dikumpulkan.");
    form.reset();
    await refreshAll();

  } catch (error) {
    toast(error.message);
  }
});

// ========================================
// FORM PENILAIAN GURU
// ========================================

document.addEventListener("submit", async event => {
  const form = event.target.closest(".gradeForm");
  if (!form) return;

  event.preventDefault();

  try {
    const data = new FormData(form);

    await api("gradeSubmission", {
      id:form.dataset.id,
      score:Number(data.get("score")),
      feedback:data.get("feedback")
    });

    toast("Penilaian berhasil disimpan.");
    await refreshAll();

  } catch (error) {
    toast(error.message);
  }
});

// ========================================
// MULAI DASHBOARD
// ========================================

async function startDashboard() {
  try {
    await refreshAll();
  } catch (error) {
    $("#pageContent").innerHTML =
      `<div class="empty">${escapeHTML(error.message)}</div>`;
  }
}

startDashboard();
</script>
